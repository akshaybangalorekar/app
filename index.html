}
@media (prefers-color-scheme: dark){

    --ink:#F3EAE3; --ink-dim:#BCAEA5; --ink-faint:#8A7B72;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.55;font-size:17px;-webkit-font-smoothing:antialiased;

p{margin:0 0 1rem}
.wrap{max-width:560px;margin:0 auto;padding:0 24px 120px}

header.top{position:sticky;top:0;z-index:30;padding:calc(env(safe-area-inset-top,0px) + 18px) 24px 12px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(1.3) blur(12px)}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:1.6rem;color:var(--wine);letter-spacing:.03em}
.icons{display:flex;gap:8px}
.icon-btn{border:1px solid var(--line);background:transparent;color:var(--ink-faint);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:.2s;font-size:1.4rem;line-height:1;padding:0}

.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.presence{max-width:560px;margin:0 auto;display:none;align-items:center;gap:8px;padding:10px 0 0;font-size:.78rem;color:var(--ink-faint)}
.presence.show{display:flex}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex:none}
.pdot.on{background:var(--sage)}

.view{display:none;animation:up .4s cubic-bezier(.2,.7,.3,1)}
.view.active{display:block}

.row:hover{border-color:var(--wine);transform:translateY(-1px)}
.row .arrow{color:var(--wine);font-size:1.2rem;font-family:var(--body)}

.big{display:block;width:100%;background:var(--wine);color:#fff;border:none;border-radius:99px;padding:19px;font-family:var(--body);
  font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:.18s;margin-top:8px}
.big:hover{background:var(--wine-deep)}
.big:active{transform:scale(.98)}
.ghost{display:block;width:100%;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:18px;
  font-family:var(--body);font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;margin-top:10px}
.ghost:hover{border-color:var(--ink-faint)}
.tiny{display:block;width:100%;background:none;border:none;color:var(--ink-faint);font-family:var(--body);font-size:.78rem;letter-spacing:.06em;
  text-transform:uppercase;font-weight:600;padding:14px;cursor:pointer;margin-top:2px}
.tiny:hover{color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:10px 16px;font-size:.85rem;cursor:pointer;color:var(--ink-dim);font-family:var(--body);transition:.15s}
.chip.on{background:var(--wine);color:#fff;border-color:var(--wine)}

.pair{display:flex;gap:10px;margin-bottom:10px}

.opt:hover{border-color:var(--wine)}
.opt.sel{background:var(--wine);color:#fff;border-color:var(--wine)}
.banner{background:var(--wine-soft);color:var(--wine);border-radius:14px;padding:14px 16px;font-size:.82rem;font-weight:700;
  letter-spacing:.06em;text-align:center;margin-bottom:18px}

.stepper{font-family:var(--display);font-size:1.5rem;line-height:1.45;min-height:5.5em;margin:0 0 1.4rem}
.stepnum{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:14px}

textarea{font-family:var(--body);font-size:1rem;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--paper);
  color:var(--ink);width:100%;min-height:88px;resize:vertical;line-height:1.5;margin-bottom:10px}
textarea:focus{outline:2px solid var(--wine);outline-offset:1px}
input[type=text],input[type=password]{font-family:var(--body);font-size:1rem;padding:14px 16px;border-radius:14px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);width:100%}
input:focus{outline:2px solid var(--wine);outline-offset:1px}

.line{font-family:var(--display);font-size:1.4rem;line-height:1.45;min-height:4em;margin:0 0 1rem;color:var(--ink)}
.quote{font-family:var(--display);font-size:1.35rem;line-height:1.45;border-left:2px solid var(--gold);padding-left:18px;margin:0 0 1rem;min-height:3em}

ul.ynm .lab{flex:1;font-size:.95rem}
.tri{display:flex;gap:6px}
.tri button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;

.tri .y.on{background:var(--sage);border-color:var(--sage);color:#fff}
.tri .m.on{background:var(--gold);border-color:var(--gold);color:#fff}
.tri .n.on{background:var(--ink-faint);border-color:var(--ink-faint);color:#fff}
.res{list-style:none;padding:0;margin:1rem 0 0}
.res li{padding:12px 16px;border-radius:12px;margin-bottom:8px;font-size:.94rem}
.res li.y{background:color-mix(in srgb,var(--sage) 18%,transparent);color:var(--sage)}
.res li.d{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);

.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{border:none;background:transparent;cursor:pointer;padding:10px 4px;border-radius:14px;color:var(--ink-faint);
  font-family:var(--display);font-size:1.05rem;transition:.18s}
.tab.on{color:var(--wine)}

.sheet,.play{position:fixed;inset:0;z-index:90;display:none;background:var(--bg);overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 24px calc(env(safe-area-inset-bottom,0px) + 40px)}
.sheet.show,.play.show{display:block;animation:up .28s ease}
.sheet-in,.play-in{max-width:560px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
.topbar .name{font-family:var(--display);font-size:1.5rem;color:var(--wine)}
.sync-status{font-size:.82rem;color:var(--ink-dim);background:var(--paper2);border-radius:12px;padding:14px 16px;margin-bottom:18px;word-break:break-word;white-space:pre-wrap}
.field{margin-bottom:16px}
.field label{display:block;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:.45rem}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:99px;
  font-size:.85rem;opacity:0;pointer-events:none;transition:.3s;z-index:120;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hint{font-size:.8rem;color:var(--ink-faint);margin-top:.6rem}

#lock{position:fixed;inset:0;z-index:100;display:none;background:var(--bg);align-items:center;justify-content:center;padding:32px 24px}
#lock.show{display:flex;animation:up .3s ease}
.lock-card{width:100%;max-width:320px;text-align:center}
.lock-mono{font-family:var(--display);font-size:2.2rem;color:var(--wine)}
.lock-rule{width:34px;height:1px;background:var(--gold);margin:16px auto 24px}
.dots{display:flex;gap:16px;justify-content:center;margin-bottom:32px}
.dot{width:13px;height:13px;border-radius:50%;border:1px solid var(--ink-faint);transition:.2s}
.dot.fill{background:var(--wine);border-color:var(--wine);transform:scale(1.08)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.key{aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font-family:var(--display);
  font-size:1.6rem;cursor:pointer;display:grid;place-items:center;padding:0}
.key:active{background:var(--wine-soft);transform:scale(.95)}

.key.del svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.lock-card.shake{animation:sh .42s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
</style>

function pinHash(s){
  const str="us.v3|"+s+"|salt"; let h=5381;
  for(let i=0;i<str.length;i++){ h=((h<<5)+h)^str.charCodeAt(i); h=h>>>0; }
  let g=2166136261;
  for(let i=0;i<str.length;i++){ g^=str.charCodeAt(i); g=Math.imul(g,16777619)>>>0; }
  let k=0;
  for(let i=str.length-1;i>=0;i--){ k=(Math.imul(k,31)+str.charCodeAt(i))>>>0; }
  return h.toString(36)+"."+g.toString(36)+"."+k.toString(36);
}

function cfgSave(){ try{ localStorage.setItem(SYNCKEY,JSON.stringify(cfg)); }catch(e){} }
function setStatus(t){ const el=$("#syncStatus"); if(el) el.textContent=t; }
function ghHeaders(json){ const h={ "Authorization":"Bearer "+cfg.token, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28" }; if(json) h["Content-Type"]="application/json"; return h; }
async function ghErr(r){
  let m=""; try{ const j=await r.json(); if(j&&j.message) m=j.message; }catch(e){}
  if(!m){ try{ m=(await r.text()).slice(0,140); }catch(e){} }
  return "HTTP "+r.status+(m? " \u2014 "+m : "");
}
function apiUrl(p){ return "https://api.github.com/repos/"+encodeURIComponent(cfg.owner)+"/"+encodeURIComponent(cfg.repo)+"/contents/"+String(p||"").split("/").filter(Boolean).map(encodeURIComponent).join("/"); }
function cleanDir(){ return String(cfg.path||"").replace(/^\/|\/$/g,""); }
function myFile(){ return cfg.name.toLowerCase().replace(/[^a-z0-9_-]/g,"")+".json"; }
function myPath(){ const d=cleanDir(); return (d? d+"/":"")+myFile(); }
async function ghGet(p){
  const r=await fetch(apiUrl(p)+"?ref="+encodeURIComponent(cfg.branch)+"&t="+Date.now(),{headers:ghHeaders(),cache:"no-store"});
  if(r.status===404) return null;
  if(!r.ok) throw new Error(await ghErr(r));
  return r.json();
}
async function ghPut(p,obj,msg){
  let sha=null; try{ const c=await ghGet(p); if(c&&c.sha) sha=c.sha; }catch(e){}
  const body={ message:msg||"update", content:btoa(unescape(encodeURIComponent(JSON.stringify(obj)))), branch:cfg.branch };
  if(sha) body.sha=sha;
  const r=await fetch(apiUrl(p),{method:"PUT",headers:ghHeaders(true),body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await ghErr(r));
  return r.json();
}
function myPayload(){ return { name:cfg.name, updated:Date.now(), online:true, answers:{ ynm:state.ynm.you||{}, signals:state.signals||{}, countdown:state.countdown||"", games:state.games||{} } }; }
async function syncPush(force){ if(!cfg||!cfg.token) return; const n=Date.now(); if(!force&&n-lastPush<120000) return; lastPush=n; await ghPut(myPath(),myPayload(),"update from "+cfg.name); }
async function syncPull(){
  if(!cfg||!cfg.token) return;
  const list=await ghGet(cleanDir()); if(!Array.isArray(list)) return;
  const other=list.filter(f=>f.type==="file"&&f.name!==myFile()&&/\.json$/.test(f.name))[0];
  if(!other) return;
  const f=await ghGet(other.path); if(!f||!f.content) return;
  let data; try{ data=JSON.parse(decodeURIComponent(escape(atob(String(f.content).replace(/\n/g,""))))); }catch(e){ return; }
  partner=data; pulling=true;
  try{
    if(data.answers){
      if(data.answers.ynm) state.ynm.partner=data.answers.ynm;
      if(data.answers.signals) Object.keys(data.answers.signals).forEach(k=>{ if(data.answers.signals[k]) state.signals[k]=true; });
      if(data.answers.countdown) state.countdown=data.answers.countdown;
      if(data.answers.games) state.partnerGames=data.answers.games;
    }
    save(); renderYnm(); renderSig(); renderCd();
    if(cur && !cur.touched && $("#play").classList.contains("show")) renderGame();
  }catch(e){}
  pulling=false; renderPresence();
}
function ago(ms){ const m=Math.floor(ms/60000); if(m<1) return "just now"; if(m<60) return m+" min ago"; const h=Math.floor(m/60); if(h<24) return h+"h ago"; return Math.floor(h/24)+"d ago"; }
function renderPresence(){
  const el=$("#presence"); if(!el) return;
  if(!cfg||!cfg.token){ el.classList.remove("show"); return; }
  el.classList.add("show");
  if(syncErr){ $("#pdot").classList.remove("on"); $("#ptext").textContent="Sync problem \u2014 tap the gear"; return; }
  if(!partner){ $("#pdot").classList.remove("on"); $("#ptext").textContent="Waiting for the first sync"; return; }
  const age=Date.now()-(partner.updated||0), on=!!partner.online&&age<7*60000;
  $("#pdot").classList.toggle("on",on);
  $("#ptext").textContent=(partner.name||"Them")+(on?" \u2014 online now":" \u2014 last seen "+ago(age));
}
function queuePush(){ if(!cfg||!cfg.token||pulling) return; clearTimeout(pushTimer); pushTimer=setTimeout(()=>syncPush(true).catch(()=>{}),6000); }
async function syncNow(force){ if(!cfg||!cfg.token){ setStatus("Not set up yet."); return; }
  try{ await syncPush(force); await syncPull(); syncErr=""; setStatus("Synced "+new Date().toLocaleTimeString()); }
  catch(e){ syncErr=e.message||"failed"; setStatus("Sync failed: "+syncErr); }
  renderPresence(); }
function scheduleSync(){
  clearInterval(syncTimer); if(!cfg||!cfg.token) return;
  const on=partner&&partner.online&&(Date.now()-(partner.updated||0)<7*60000);
  syncTimer=setInterval(()=>{ if(document.visibilityState==="visible") syncPull().catch(()=>{}); }, on?90000:300000);
}
function loadCfg(){
  $("#cfgName").value=(cfg&&cfg.name)||""; $("#cfgToken").value=(cfg&&cfg.token)||"";
  $("#cfgOwner").value=(cfg&&cfg.owner)||""; $("#cfgRepo").value=(cfg&&cfg.repo)||"";
  $("#cfgPath").value=(cfg&&cfg.path)||"us"; $("#cfgBranch").value=(cfg&&cfg.branch)||"main";
}
$("#settingsBtn").addEventListener("click",()=>{ loadCfg(); $("#sheet").classList.add("show"); });
$("#cfgClose").addEventListener("click",()=>$("#sheet").classList.remove("show"));
$("#cfgSave").addEventListener("click",()=>{
  cfg={ name:$("#cfgName").value.trim(), token:$("#cfgToken").value.trim(), owner:$("#cfgOwner").value.trim(),
        repo:$("#cfgRepo").value.trim(), path:$("#cfgPath").value.trim()||"us", branch:$("#cfgBranch").value.trim()||"main" };
  if(!cfg.name||!cfg.token||!cfg.owner||!cfg.repo){ setStatus("Fill in name, token, owner and repo."); return; }
  cfgSave(); setStatus("Saved. Syncing\u2026"); scheduleSync(); syncNow(true);
});
async function diagnose(){
  const L=[];
  L.push("Repo: "+cfg.owner+"/"+cfg.repo+"    Folder: "+(cleanDir()||"(root)")+"    Branch: "+cfg.branch);
  L.push("Your file: "+myPath());
  L.push("Token: "+(cfg.token? cfg.token.slice(0,11)+"\u2026 ("+cfg.token.length+" chars)" : "MISSING"));
  L.push("");
  try{
    const r=await fetch("https://api.github.com/repos/"+encodeURIComponent(cfg.owner)+"/"+encodeURIComponent(cfg.repo),{headers:ghHeaders(),cache:"no-store"});
    if(!r.ok){ L.push("1. Repo access: FAILED \u2014 "+await ghErr(r)); return L.join("\n"); }
    const j=await r.json();
    L.push("1. Repo access: OK ("+(j.private?"private":"PUBLIC")+")");
  }catch(e){ L.push("1. Repo access: FAILED \u2014 "+e.message); return L.join("\n"); }
  try{
    const l=await ghGet(cleanDir());
    L.push("2. Read folder: "+(Array.isArray(l)? "OK, "+l.length+" file(s)" : "empty \u2014 will be created"));
  }catch(e){ L.push("2. Read folder: FAILED \u2014 "+e.message); return L.join("\n"); }
  try{
    await ghPut(myPath(), myPayload(), "diagnostic write");
    L.push("3. Write: OK");
  }catch(e){ L.push("3. Write: FAILED \u2014 "+e.message); return L.join("\n"); }
  try{
    await syncPull();
    L.push("4. Read partner: "+(partner? "OK \u2014 "+partner.name : "no partner file yet"));
  }catch(e){ L.push("4. Read partner: FAILED \u2014 "+e.message); }
  L.push(""); L.push("All good. Press Sync now.");
  return L.join("\n");
}
$("#cfgTest").addEventListener("click",async()=>{
  if(!cfg||!cfg.token){ setStatus("Save first \u2014 fill the fields and press Save."); return; }
  setStatus("Checking\u2026");
  try{ setStatus(await diagnose()); }catch(e){ setStatus("Check failed: "+e.message); }
});
$("#cfgSync").addEventListener("click",()=>syncNow(true));
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ syncPull().catch(()=>{}); scheduleSync(); } });

/* Ask the browser to keep this origin's storage for good, so a saved token and its answers are not evicted. */
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
renderPresence();
if(cfg&&cfg.token){ setStatus("Ready."); syncNow(false); scheduleSync(); }
showLock("unlock");
</script>
</body>
</html>
